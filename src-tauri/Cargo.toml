[package]
name = "streameo_iptv"
version = "1.2.6"
description = "Fast And Powerful IPTV App"
authors = ["kaveyro"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.91.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "streameo_iptv_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
serde_json = "1.0.145"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.9.3", features = [] }
anyhow = { version = "1.0.100" }
regex = { version = "1.12.2", features = ["std"] }
directories = "6.0.0"
reqwest = { version = "0.12.24", features = ["json"] }
tokio = { version = "1.48.0", features = ["full"] }
url = "2.5.7"
r2d2_sqlite = "0.25.0"
r2d2 = "0.8.10"
bytes = "1.11.0"
tauri-plugin-dialog = "2.7.1"
chrono = "0.4.42"
which = "7.0.3"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-shell = "2.3.3"
simplelog = "0.12.2"
log = "0.4.28"
rusqlite_migration = "1.3.1"
base64 = "0.22.1"
tauri-plugin-notification = "2.3.3"
warp = "0.3.7"
if-addrs = "0.13.4"
tokio-util = "0.7.17"
indexmap = "2.12.1"
futures = "0.3.32"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
shell-words = "1.1.0"
quick-xml = "0.36"
flate2 = "1"
getrandom = "0.2"
sha2 = "0.10"
tauri-plugin-window-state = "2.4.1"
[target.'cfg(target_os = "windows")'.dependencies]
winsplit = "0.1.0"
keyring = { version = "3", features = ["windows-native"] }
# Raw Win32 FFI for embedding the persistent mpv child window (--wid) into the
# main window. windows-sys keeps C-style signatures stable across versions and
# we only exchange an isize HWND across the Tauri boundary, so its version is
# decoupled from Tauri's own `windows` crate.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# NOTE: the sync-secret-service feature requires libdbus (e.g. libdbus-1-dev
# on Debian/Ubuntu, dbus-devel on Fedora) to be installed at BUILD time on Linux.
# At runtime a missing/locked secret service is handled gracefully: passwords
# simply stay in the SQLite database as before.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.3.6"
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri = { version = "2.9.3", features = ["tray-icon"] }
