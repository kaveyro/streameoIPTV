<div
  id="tile-{{ id }}"
  placement="top"
  tabindex="0"
  role="button"
  [attr.aria-label]="ariaLabel()"
  (keyup.enter)="click()"
  [ngClass]="{
    playing: starting,
    faded: fade,
    'channel-list': format === 'list',
    'has-now-playing': !!nowPlaying,
  }"
  [ngbTooltip]="channel?.name"
  triggers="hover focus"
  (click)="click()"
  class="channel d-inline-flex p-2 align-items-center"
  (contextmenu)="onRightClick($event)"
>
  <div class="image-container">
    <img
      (error)="onError($event)"
      class="channel-image"
      *ngIf="channel?.image && showImage && logoSrc"
      [src]="logoSrc"
    />
  </div>
  <div class="channel-title-container">
    <div class="channel-names">
      <div class="channel-title">
        <span *ngIf="channel?.number != null" class="channel-number" aria-hidden="true">{{
          channel?.number
        }}</span
        ><span
          *ngIf="countryCode && memory.CountryPrefixMode === 'badge'"
          class="country-badge"
          aria-hidden="true"
          >{{ countryCode }}</span
        >{{ channel?.name | countryName: memory.CountryPrefixMode }}
      </div>
      <div *ngIf="memory.ShowChannelSource" class="channel-source">{{ sourceName }}</div>
    </div>
    <!-- Movies and episodes left midway; the aria-label carries the share. -->
    <div
      *ngIf="watchProgress !== undefined"
      class="now-playing-track watch-track"
      aria-hidden="true"
    >
      <div class="now-playing-fill" [style.width.%]="watchProgress"></div>
    </div>
    <!-- Only once a programme is known: tiles without EPG stay compact. The
         tile's aria-label already carries the programme. -->
    <div *ngIf="nowPlaying" class="now-playing" aria-hidden="true">
      <div class="now-line">
        <span class="now-title">{{ nowPlaying.title }}</span>
        <span class="now-time">{{ nowPlayingTimes }}</span>
      </div>
      <div class="now-playing-track">
        <div class="now-playing-fill" [style.width.%]="nowPlayingProgress"></div>
      </div>
      <div *ngIf="nowPlaying.next" class="next-line">
        {{ "PLAYER.NEXT" | translate }} {{ nextStart }} &middot; {{ nowPlaying.next.title }}
      </div>
    </div>
  </div>
  <div class="tile-badges d-flex flex-column justify-content-center align-items-center h-100">
    <span *ngIf="showResumeBadge()" class="resume-badge">{{ "TILE.RESUME" | translate }}</span>
    <svg
      *ngIf="watched"
      fill="currentColor"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      class="watched-icon"
    >
      <title>{{ "TILE.WATCHED" | translate }}</title>
      <path
        d="M12 2C6.5 2 2 6.5 2 12S6.5 22 12 22 22 17.5 22 12 17.5 2 12 2M10 17L5 12L6.41 10.59L10 14.17L17.59 6.58L19 8L10 17Z"
      />
    </svg>
    <svg
      *ngIf="isLockedGroup()"
      fill="currentColor"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      class="lock-icon"
    >
      <title>{{ "TILE.LOCKED_GROUP" | translate }}</title>
      <path
        d="M12,17A2,2 0 0,0 14,15C14,13.89 13.1,13 12,13A2,2 0 0,0 10,15A2,2 0 0,0 12,17M18,8A2,2 0 0,1 20,10V20A2,2 0 0,1 18,22H6A2,2 0 0,1 4,20V10C4,8.89 4.9,8 6,8H7V6A5,5 0 0,1 12,1A5,5 0 0,1 17,6V8H18M12,3A3,3 0 0,0 9,6V8H15V6A3,3 0 0,0 12,3Z"
      />
    </svg>
    <svg
      *ngIf="channel?.tv_archive === true"
      fill="currentColor"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      class="archive-icon"
    >
      <title>{{ "TILE.CATCHUP_AVAILABLE" | translate }}</title>
      <path
        d="M20 6H2V2H20V6M16.5 12H15V17L18.61 19.16L19.36 17.94L16.5 16.25V12M23 16C23 19.87 19.87 23 16 23C13.62 23 11.53 21.81 10.26 20H3V7H19V9.68C21.36 10.81 23 13.21 23 16M8 12H10.26C10.83 11.19 11.56 10.5 12.41 10H8.5C8.22 10 8 10.22 8 10.5V12M21 16C21 13.24 18.76 11 16 11S11 13.24 11 16 13.24 21 16 21 21 18.76 21 16Z"
      />
    </svg>
    <svg
      *ngIf="channel?.favorite"
      fill="currentColor"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      class="favorite-icon"
    >
      <title>{{ "TILE.IS_FAVORITE" | translate }}</title>
      <path
        d="M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.62L12,2L9.19,8.62L2,9.24L7.45,13.97L5.82,21L12,17.27Z"
      />
    </svg>
  </div>
</div>

<div
  style="visibility: hidden; position: fixed"
  [style.left.px]="menuTopLeftPosition.x"
  [style.top.px]="menuTopLeftPosition.y"
  [matMenuTriggerFor]="rightMenu"
></div>

<mat-menu #rightMenu="matMenu">
  <ng-template matMenuContent let-item="item">
    <button
      [hidden]="viewMode !== viewModeEnum.History"
      mat-menu-item
      (click)="removeFromHistory()"
    >
      {{ "MENU.REMOVE" | translate }}
    </button>
    <button
      [hidden]="
        channel?.media_type === mediaTypeEnum.group ||
        channel?.media_type === mediaTypeEnum.season ||
        viewMode === viewModeEnum.History
      "
      mat-menu-item
      (click)="favorite()"
    >
      <ng-container *ngIf="alreadyExistsInFav">{{ "MENU.UNFAVORITE" | translate }}</ng-container>
      <ng-container *ngIf="!alreadyExistsInFav">{{ "MENU.FAVORITE" | translate }}</ng-container>
    </button>
    <button [hidden]="!canFavorite()" mat-menu-item [matMenuTriggerFor]="listsMenu">
      {{ "FAV_LISTS.ADD_TO_LIST" | translate }}
    </button>
    <button [hidden]="favoriteList === undefined" mat-menu-item (click)="removeFromList()">
      {{ "FAV_LISTS.REMOVE_FROM_LIST" | translate }}
    </button>
    <button [hidden]="!reorderable || first" mat-menu-item (click)="moveBy(-1)">
      {{ "FAV_LISTS.MOVE_FORWARD" | translate }}
    </button>
    <button [hidden]="!reorderable || last" mat-menu-item (click)="moveBy(1)">
      {{ "FAV_LISTS.MOVE_BACK" | translate }}
    </button>
    <button [hidden]="!resumable" mat-menu-item (click)="playFromStart()">
      {{ "MENU.PLAY_FROM_START" | translate }}
    </button>
    <button [hidden]="!resumable && !watched" mat-menu-item (click)="markUnwatched()">
      {{ "MENU.MARK_UNWATCHED" | translate }}
    </button>
    <button [hidden]="!isLivestream()" mat-menu-item (click)="record()">
      {{ "MENU.RECORD" | translate }}
    </button>
    <button [hidden]="!isMovie() || downloading" mat-menu-item (click)="downloadVod()">
      {{ "MENU.DOWNLOAD" | translate }}
    </button>
    <button [hidden]="!isMovie() || !downloading" mat-menu-item (click)="cancelDownload()">
      {{ "MENU.CANCEL_DOWNLOAD" | translate }}
    </button>
    <button [hidden]="!showEPG()" mat-menu-item (click)="showEPGModal()">
      {{ "MENU.EPG" | translate }}
    </button>
    <button [hidden]="!canMapEpg()" mat-menu-item (click)="openEpgMapping()">
      {{ "MENU.MAP_EPG" | translate }}
    </button>
    <button [hidden]="!isCustom()" mat-menu-item (click)="edit()">
      {{ "MENU.EDIT" | translate }}
    </button>
    <button [hidden]="!isCustom()" mat-menu-item (click)="share()">
      {{ "MENU.SHARE" | translate }}
    </button>
    <button [hidden]="!isLivestream()" mat-menu-item (click)="openRestreamModal()">
      {{ "MENU.RESTREAM" | translate }}
    </button>
    <button
      mat-menu-item
      [hidden]="
        channel?.media_type === mediaTypeEnum.group || channel?.media_type === mediaTypeEnum.season
      "
      (click)="copyURL()"
    >
      {{ "MENU.COPY_URL" | translate }}
    </button>
    <button [hidden]="!isGroup()" mat-menu-item (click)="toggleGroupLock()">
      {{ (isLockedGroup() ? "MENU.UNLOCK_GROUP" : "MENU.LOCK_GROUP") | translate }}
    </button>
    <button [hidden]="!isCustom()" mat-menu-item (click)="delete()">
      {{ "MENU.DELETE" | translate }}
    </button>
  </ng-template>
</mat-menu>

<!-- "Add to list": ticking a list keeps the menu open, so several lists can
     be set in a row. -->
<mat-menu #listsMenu="matMenu">
  <ng-template matMenuContent>
    <button
      *ngFor="let list of favoriteLists.lists | async"
      mat-menu-item
      role="menuitemcheckbox"
      [attr.aria-checked]="isInList(list)"
      [disabled]="!listMembership"
      (click)="toggleList(list, $event)"
    >
      <span class="list-check" aria-hidden="true">
        <svg *ngIf="isInList(list)" fill="currentColor" viewBox="0 0 24 24">
          <path d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z" />
        </svg>
      </span>
      {{ list.name }}
    </button>
    <button mat-menu-item (click)="addToNewList()">
      <span class="list-check" aria-hidden="true"></span>
      {{ "FAV_LISTS.NEW_LIST_ELLIPSIS" | translate }}
    </button>
  </ng-template>
</mat-menu>
