<div class="modal-header">
  <h4 class="modal-title lbl">
    <ng-container *ngIf="!editing">
      {{ "EDIT_CHANNEL.CREATE_TITLE" | translate }}
    </ng-container>
    <ng-container *ngIf="editing">
      {{ "EDIT_CHANNEL.EDIT_TITLE" | translate: { name: channel.data.name } }}
    </ng-container>
  </h4>
  <button
    type="button"
    class="btn-close btn-close-white"
    [attr.aria-label]="'MODAL.CLOSE' | translate"
    (click)="activeModal.close('Cross click')"
  ></button>
</div>
<form #form="ngForm" (ngSubmit)="save()">
  <div class="modal-body">
    <div class="row mt-3 align-items-center">
      <div class="col-4">
        <label for="ecm-name"
          >{{ "EDIT_CHANNEL.NAME" | translate }} <span class="text-danger">*</span></label
        >
      </div>
      <div class="col">
        <input
          #name="ngModel"
          id="ecm-name"
          ngbAutofocus
          (ngModelChange)="onNameChange($event)"
          name="name"
          required
          class="form-control"
          [class.is-invalid]="(name.errors?.['required'] && name.dirty) || channelExists"
          [(ngModel)]="channel.data.name"
          [placeholder]="'EDIT_CHANNEL.NAME_PLACEHOLDER' | translate"
        />
      </div>
    </div>
    <div class="row mt-1 ps-3 align-items-center">
      <div class="col-4"></div>
      <div *ngIf="name.errors?.['required'] && name.dirty" class="col text-danger error">
        {{ "FORM.REQUIRED" | translate }}
      </div>
    </div>
    <div class="row mt-3 align-items-center">
      <div class="col-4">
        <label for="ecm-image">{{ "EDIT_CHANNEL.IMAGE" | translate }}</label>
      </div>
      <div class="col">
        <input
          id="ecm-image"
          class="form-control"
          name="image"
          [(ngModel)]="channel.data.image"
          placeholder="https://example.com/image.png"
        />
      </div>
    </div>
    <div class="row mt-3 align-items-center">
      <div class="col-4">
        <label for="ecm-url"
          >{{ "EDIT_CHANNEL.URL" | translate }} <span class="text-danger">*</span></label
        >
      </div>
      <div class="col">
        <input
          #url="ngModel"
          id="ecm-url"
          name="url"
          (ngModelChange)="onUrlChange($event)"
          required
          class="form-control"
          [class.is-invalid]="(url.errors?.['required'] && url.dirty) || channelExists"
          [(ngModel)]="channel.data.url"
          [placeholder]="'EDIT_CHANNEL.URL_PLACEHOLDER' | translate"
        />
      </div>
    </div>
    <div class="row mt-1 ps-3 align-items-center">
      <div class="col-4"></div>
      <div *ngIf="url.errors?.['required'] && url.dirty" class="col text-danger error">
        {{ "FORM.REQUIRED" | translate }}
      </div>
    </div>
    <div class="row mt-3 align-items-center">
      <div class="col-4">
        <label for="ecm-media-type"
          >{{ "EDIT_CHANNEL.MEDIA_TYPE" | translate }} <span class="text-danger">*</span></label
        >
      </div>
      <div class="col">
        <select
          #mediaType="ngModel"
          id="ecm-media-type"
          name="mediaType"
          required
          [(ngModel)]="channel.data.media_type"
          class="form-control"
          [class.is-invalid]="mediaType.errors?.['required'] && mediaType.dirty"
        >
          <option [ngValue]="mediaTypeEnum.livestream">
            {{ "EDIT_CHANNEL.LIVESTREAM" | translate }}
          </option>
          <option [ngValue]="mediaTypeEnum.movie">{{ "EDIT_CHANNEL.MOVIE" | translate }}</option>
        </select>
      </div>
    </div>
    <div class="row mt-3 align-items-center">
      <div class="col-4">
        <label for="ecm-group">{{ "EDIT_CHANNEL.CATEGORY" | translate }}</label>
      </div>
      <div class="col">
        <input
          id="ecm-group"
          [placeholder]="'FORM.TYPEAHEAD_PLACEHOLDER' | translate"
          (ngModelChange)="checkEmpty($event)"
          name="group"
          type="text"
          class="form-control"
          [(ngModel)]="group"
          [ngbTypeahead]="search"
          (selectItem)="selectGroup($event)"
          [resultFormatter]="formatter"
          [inputFormatter]="formatter"
        />
      </div>
    </div>
    <div class="row mt-1 ps-3 align-items-center">
      <div class="col-4"></div>
      <div *ngIf="mediaType.errors?.['required'] && mediaType.dirty" class="col error text-danger">
        {{ "FORM.REQUIRED" | translate }}
      </div>
    </div>
    <div class="row mt-3 align-items-center">
      <div class="col-4">
        <label for="ecm-user-agent">{{ "EDIT_CHANNEL.HTTP_USER_AGENT" | translate }}</label>
      </div>
      <div class="col">
        <input
          id="ecm-user-agent"
          name="httpUserAgent"
          class="form-control"
          placeholder="Mozilla/5.0 (Windows NT 10.0; Win64; x64)..."
          [(ngModel)]="channel.headers!.user_agent"
        />
      </div>
    </div>
    <div class="row mt-3 align-items-center">
      <div class="col-4">
        <label for="ecm-origin">{{ "EDIT_CHANNEL.HTTP_ORIGIN" | translate }}</label>
      </div>
      <div class="col">
        <input
          id="ecm-origin"
          name="httpOrigin"
          class="form-control"
          placeholder="https://example.com"
          [(ngModel)]="channel.headers!.http_origin"
        />
      </div>
    </div>
    <div class="row mt-3 align-items-center">
      <div class="col-4">
        <label for="ecm-referrer">{{ "EDIT_CHANNEL.HTTP_REFERRER" | translate }}</label>
      </div>
      <div class="col">
        <input
          id="ecm-referrer"
          name="httpReferrer"
          class="form-control"
          placeholder="https://example.com"
          [(ngModel)]="channel.headers!.referrer"
        />
      </div>
    </div>
    <div class="row mt-3 align-items-center">
      <div class="col-4">
        <label for="ecm-ignore-ssl">{{ "EDIT_CHANNEL.IGNORE_SSL" | translate }}</label>
      </div>
      <div class="col">
        <div class="form-check form-switch">
          <input
            id="ecm-ignore-ssl"
            name="ignoreSSL"
            [(ngModel)]="channel.headers!.ignore_ssl"
            class="form-check-input"
            type="checkbox"
            role="switch"
          />
        </div>
      </div>
    </div>
  </div>
  <p *ngIf="channelExists" class="text-danger error mb-2 bs-col-padding">
    {{ "EDIT_CHANNEL.ALREADY_EXISTS" | translate }}
  </p>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="activeModal.close('Cross click')">
      {{ "MODAL.CANCEL" | translate }}
    </button>
    <button
      [disabled]="!form.valid || loading || channelExists"
      class="btn btn-primary d-inline-flex align-items-center"
      type="submit"
    >
      <span>{{ "MODAL.SAVE" | translate }}</span>
      <svg
        class="ms-1 save-floppy"
        aria-hidden="true"
        fill="currentColor"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
      >
        <path
          d="M15,9H5V5H15M12,19A3,3 0 0,1 9,16A3,3 0 0,1 12,13A3,3 0 0,1 15,16A3,3 0 0,1 12,19M17,3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V7L17,3Z"
        />
      </svg>
    </button>
  </div>
</form>
