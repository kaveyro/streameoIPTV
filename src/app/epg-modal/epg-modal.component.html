<div class="modal-header">
  <h4 class="modal-title lbl">
    {{ name }}
  </h4>
  <button
    type="button"
    class="btn-close btn-close-white"
    [attr.aria-label]="'MODAL.CLOSE' | translate"
    (click)="activeModal.close('Cross click')"
  ></button>
</div>
<div class="modal-body">
  <div class="day-nav mb-3">
    <button
      type="button"
      class="icon-btn day-arrow"
      [disabled]="!canShiftDay(-1)"
      (click)="prev()"
      [attr.aria-label]="'EPG.PREV_DAY' | translate"
      [ngbTooltip]="'EPG.PREV_DAY' | translate"
    >
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z" />
      </svg>
    </button>
    <span class="date-text" aria-live="polite">{{ getFormattedDate() }}</span>
    <button
      type="button"
      class="icon-btn day-arrow"
      [disabled]="!canShiftDay(1)"
      (click)="next()"
      [attr.aria-label]="'EPG.NEXT_DAY' | translate"
      [ngbTooltip]="'EPG.NEXT_DAY' | translate"
    >
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M4,11V13H16L10.5,18.5L11.92,19.92L19.84,12L11.92,4.08L10.5,5.5L16,11H4Z" />
      </svg>
    </button>
    <button
      type="button"
      class="btn btn-sm btn-outline-secondary day-today"
      [disabled]="isToday()"
      (click)="goToday()"
    >
      {{ "GUIDE.TODAY" | translate }}
    </button>
  </div>

  <div *ngIf="filteredEPGs.length === 0" class="empty-state epg-empty">
    <p class="mb-0">{{ "EPG.NO_PROGRAMMES" | translate }}</p>
  </div>

  <div class="epg-list">
    <div
      *ngFor="let item of filteredEPGs"
      class="epg-entry"
      [class.epg-entry--now]="item.now_playing"
    >
      <app-epg-modal-item
        [epg]="item"
        [name]="name"
        [sourceId]="sourceId"
        [channelId]="channelId"
        [scheduledRecordingId]="getScheduledRecordingId(item)"
        [day]="currentDate"
        (scheduleChanged)="loadScheduledRecordings()"
      ></app-epg-modal-item>
    </div>
  </div>
</div>
