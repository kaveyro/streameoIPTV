<div class="modal-header">
  <h4 class="modal-title lbl">{{ "ERROR.TITLE" | translate }}</h4>
  <button
    type="button"
    class="btn-close btn-close-white"
    [attr.aria-label]="'MODAL.CLOSE' | translate"
    (click)="activeModal.close('Cross click')"
  ></button>
</div>
<div class="modal-body">
  <p class="lbl">
    <span
      [innerHTML]="
        'ERROR.OCCURRED' | translate: { link: 'https://github.com/kaveyro/streameoIPTV/issues' }
      "
    ></span>
  </p>
  <p class="mb-2">{{ "ERROR.LOGS_FOLDER_HINT" | translate }}</p>
  <!-- The same actions as in Settings → Data, instead of OS-specific paths -->
  <div class="d-flex flex-wrap gap-2 mb-3">
    <button type="button" class="btn btn-outline-secondary btn-sm" (click)="openLogFolder()">
      {{ "SETTINGS.DATA.LOG_FOLDER_BTN" | translate }}
    </button>
    <button
      type="button"
      class="btn btn-outline-secondary btn-sm"
      [disabled]="exporting"
      [attr.aria-busy]="exporting"
      (click)="exportDiagnostics()"
    >
      {{ "SETTINGS.DATA.DIAGNOSTICS_BTN" | translate }}
    </button>
  </div>
  <p>{{ "ERROR.ATTACH_LOGS" | translate }}</p>
  <p>{{ "ERROR.PERSISTENT_DIAGNOSTICS" | translate }}</p>
  <textarea
    autocomplete="off"
    spellcheck="false"
    readonly
    class="error-area"
    [attr.aria-label]="'ERROR.TITLE' | translate"
    >{{ error }}</textarea>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="copy()">
    {{ "ERROR.COPY" | translate }}
  </button>
  <button type="button" class="btn btn-secondary" (click)="activeModal.close('close')">
    {{ "MODAL.CLOSE_BTN" | translate }}
  </button>
</div>
